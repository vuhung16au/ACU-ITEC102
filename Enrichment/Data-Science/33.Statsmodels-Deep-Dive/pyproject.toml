[project]
name = "statsmodels-deep-dive"
version = "0.1.0"
description = "A concise enrichment project showing how statsmodels complements Pandas and SciPy with confidence intervals, Q-Q diagnostics, OLS regression, and multiple-testing correction."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
