[project]
name = "nosql-data-store"
version = "0.1.0"
description = "FastAPI application with MongoDB for unstructured data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pymongo>=4.6.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
