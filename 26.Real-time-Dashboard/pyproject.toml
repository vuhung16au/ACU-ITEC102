[project]
name = "real-time-dashboard"
version = "0.1.0"
description = "Real-time Dashboard with Streamlit and DuckDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.31.0",
    "duckdb>=0.10.0",
    "polars>=0.20.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "plotly>=5.18.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
